<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — HGW Colombia</title>
<meta name="description" content="La página que buscas no existe en HGW Natural. Explora el catálogo de productos, los mercados y las preguntas frecuentes.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://hgwnatural.com/404">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e0d;--bg-light:#141918;--surface:#1a201f;--accent-green:#00ff9d;--accent-purple:#b794f6;--accent-blue:#4fd1ff;--text-primary:#fff;--text-secondary:#a8b3b0;--text-muted:#5a6864;--gradient-1:linear-gradient(135deg,#00ff9d 0%,#00cc7d 100%);--font-display:'Sora',sans-serif;--font-body:'Inter',sans-serif}
body{font-family:var(--font-body);background:var(--bg);color:var(--text-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(0,255,157,.06) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(183,148,246,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
h1{font-family:var(--font-display);font-size:clamp(6rem,15vw,12rem);font-weight:800;background:var(--gradient-1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem}
h2{font-family:var(--font-display);font-size:clamp(1.5rem,3vw,2.5rem);font-weight:700;margin-bottom:1rem}
p{font-size:1.125rem;color:var(--text-secondary);margin-bottom:2rem;max-width:500px}
.btn{background:var(--gradient-1);color:#0a0e0d;padding:1rem 2.5rem;border-radius:100px;text-decoration:none;font-size:.875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-block;transition:all .3s;box-shadow:0 8px 24px rgba(0,255,157,.3)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,255,157,.4)}
</style>
</head>
<body>
<div style="position:relative;z-index:1">
<h1>404</h1>
<h2>Página no encontrada</h2>
<p>La página que buscas no existe o fue movida. Pero nuestros productos estrella siguen aquí para ti.</p>
<a href="https://hgwnatural.com" class="btn">Volver al inicio</a>
</div>
<!-- AVISO DE COOKIES -->
<div id="hgw-cookie-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(10,14,20,.97);border-top:1px solid rgba(0,255,157,.25);backdrop-filter:blur(12px);padding:1.15rem 1.5rem">
<div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between">
<p style="color:var(--text-secondary);font-size:.875rem;line-height:1.6;margin:0;flex:1 1 340px">Usamos cookies analíticas para entender cómo se usa el sitio. Puedes aceptarlas o rechazarlas. <a href="/cookies" style="color:var(--accent-green)">Más información</a></p>
<div style="display:flex;gap:.6rem;flex-shrink:0">
<button id="hgw-cookie-reject" style="background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text-secondary);padding:.6rem 1.15rem;border-radius:100px;font-size:.8125rem;font-weight:600;cursor:pointer">Rechazar</button>
<button id="hgw-cookie-accept" style="background:var(--accent-green);border:none;color:#06120c;padding:.6rem 1.35rem;border-radius:100px;font-size:.8125rem;font-weight:700;cursor:pointer">Aceptar</button>
</div></div></div>
<script>
(function(){
  var KEY='hgw_cookie_consent';
  var choice=null;
  try{choice=localStorage.getItem(KEY);}catch(e){}
  var b=document.getElementById('hgw-cookie-banner');
  if(!choice){b.style.display='block';}
  function set(v){
    try{localStorage.setItem(KEY,v);}catch(e){}
    b.style.display='none';
    if(v==='accepted' && typeof window.hgwLoadAnalytics==='function'){window.hgwLoadAnalytics();}
  }
  document.getElementById('hgw-cookie-accept').addEventListener('click',function(){set('accepted');});
  document.getElementById('hgw-cookie-reject').addEventListener('click',function(){set('rejected');});
})();
</script>
<script src="/assets/js/analytics-config.js"></script>
<script src="/assets/js/analytics.js" defer></script>
</body>
</html>
